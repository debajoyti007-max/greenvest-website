<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#18112b" />
      <stop offset="60%" stop-color="#0a0714" />
      <stop offset="100%" stop-color="#040208" />
    </radialGradient>

    <!-- Outer Crest Border Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="25%" stop-color="#7e22ce" />
      <stop offset="50%" stop-color="#00f5ff" />
      <stop offset="75%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Inner Shield Face Gradient -->
    <linearGradient id="shieldFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241442" />
      <stop offset="50%" stop-color="#140b27" />
      <stop offset="100%" stop-color="#0d071a" />
    </linearGradient>

    <!-- Monogram R Metallic Titanium Gradient -->
    <linearGradient id="titaniumMetal" x1="0%" y1="0%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="22%" stop-color="#e2e8f0" />
      <stop offset="48%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Core Cyber Amethyst Gradient -->
    <linearGradient id="amethystCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>

    <!-- Electric Cyan Neon Laser -->
    <linearGradient id="laserCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Laser Line Glow -->
    <filter id="laserGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Dark Rounded Canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Outer Cyber Ambient Halo Ring -->
  <circle cx="256" cy="246" r="210" fill="none" stroke="url(#amethystCore)" stroke-width="1.5" stroke-dasharray="14 10" opacity="0.25" />
  <circle cx="256" cy="246" r="195" fill="none" stroke="#00f5ff" stroke-width="1" stroke-dasharray="6 8" opacity="0.3" />

  <!-- Outer Hexagonal Faceted Cyber Crest Shield (Glowing Base) -->
  <polygon points="256,48 436,138 436,346 256,448 76,346 76,138" fill="url(#shieldFace)" stroke="url(#shieldBorder)" stroke-width="4.5" filter="url(#neonGlow)" />

  <!-- Inner Inset Shield Track -->
  <polygon points="256,66 418,148 418,336 256,428 94,336 94,148" fill="#0d081b" stroke="#7e22ce" stroke-width="1.8" opacity="0.8" />

  <!-- Technical Circuit Grid Lines inside Shield -->
  <g opacity="0.22" stroke="#a855f7" stroke-width="1.2">
    <line x1="130" y1="160" x2="382" y2="160" />
    <line x1="110" y1="246" x2="402" y2="246" />
    <line x1="130" y1="332" x2="382" y2="332" />
    <line x1="256" y1="76" x2="256" y2="416" />
    <!-- Tech Corner Ticks -->
    <circle cx="256" cy="66" r="3.5" fill="#00f5ff" />
    <circle cx="418" cy="148" r="3.5" fill="#a855f7" />
    <circle cx="418" cy="336" r="3.5" fill="#00f5ff" />
    <circle cx="256" cy="428" r="3.5" fill="#a855f7" />
    <circle cx="94" cy="336" r="3.5" fill="#00f5ff" />
    <circle cx="94" cy="148" r="3.5" fill="#a855f7" />
  </g>

  <!-- ══════════════════════════════════════════════════════════════
       THE MONOGRAM "R" — AEROSPACE CYBERNETIC GEOMETRY
       ══════════════════════════════════════════════════════════════ -->
  <g id="rymon-monogram" filter="drop-shadow(0 14px 28px rgba(0,0,0,0.85))">
    <!-- Left Vertical Spine Pillar -->
    <path d="M 158 132 L 210 132 L 210 360 L 158 360 Z" fill="url(#titaniumMetal)" />
    <!-- Left Spine Cyber Bevel -->
    <path d="M 158 132 L 174 148 L 174 344 L 158 360 Z" fill="#64748b" opacity="0.65" />
    <path d="M 194 148 L 210 132 L 210 360 L 194 344 Z" fill="#ffffff" opacity="0.45" />

    <!-- Top Loop (Upper R Bowl - Faceted Hex Geometry) -->
    <path d="M 210 132 L 314 132 C 348 132 368 152 368 186 C 368 220 348 240 314 240 L 210 240 Z" fill="url(#titaniumMetal)" />
    <!-- Inner Bowl Cutout -->
    <path d="M 210 170 L 302 170 C 318 170 328 178 328 186 C 328 194 318 202 302 202 L 210 202 Z" fill="#0b0716" />

    <!-- Upper Bowl Metallic Edge Highlight -->
    <path d="M 210 132 L 314 132 C 348 132 368 152 368 186" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

    <!-- Dynamic Diagonal Thrust Leg (The R Kick-Leg) -->
    <path d="M 252 232 L 324 232 L 378 360 L 320 360 Z" fill="url(#titaniumMetal)" />
    <!-- Leg Inner Shadow & Bevel -->
    <path d="M 252 232 L 268 246 L 310 346 L 320 360 L 298 360 Z" fill="#475569" opacity="0.7" />

    <!-- ── LUMINOUS CYBER CONDUITS (AMETHYST & ELECTRIC CYAN) ── -->
    <!-- Center Splice Laser Beam -->
    <path d="M 174 136 L 174 356" stroke="url(#laserCyan)" stroke-width="4" stroke-linecap="round" filter="url(#laserGlow)" />
    <path d="M 210 236 L 318 236" stroke="#00f5ff" stroke-width="3.5" stroke-linecap="round" filter="url(#laserGlow)" />
    
    <!-- Angular Chevron Accelerators -->
    <polygon points="314,242 374,360 360,360 306,242" fill="url(#amethystCore)" opacity="0.9" filter="url(#laserGlow)" />
    
    <!-- Micro Core Node Pulse -->
    <circle cx="210" cy="236" r="6" fill="#00f5ff" filter="url(#laserGlow)" />
    <circle cx="318" cy="236" r="4.5" fill="#c084fc" filter="url(#laserGlow)" />
    <circle cx="372" cy="356" r="4.5" fill="#00f5ff" filter="url(#laserGlow)" />
  </g>

  <!-- Crest Top Crown Sensor Dot -->
  <circle cx="256" cy="48" r="5" fill="#00f5ff" filter="url(#laserGlow)" />
  <circle cx="256" cy="448" r="5" fill="#a855f7" filter="url(#laserGlow)" />
</svg>
