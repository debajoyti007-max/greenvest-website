<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="iconBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#121624" />
      <stop offset="60%" stop-color="#080a10" />
      <stop offset="100%" stop-color="#030406" />
    </radialGradient>

    <!-- Titanium Metal Sheen -->
    <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e2e8f0" />
      <stop offset="65%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Amethyst / Cyan Neon -->
    <linearGradient id="cyberLaser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="45%" stop-color="#a855f7" />
      <stop offset="80%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Rounded App Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#iconBg)" stroke="#1e293b" stroke-width="2" />

  <!-- Outer Technical Alignment Marks -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="16 12" opacity="0.6" />
  <circle cx="256" cy="256" r="196" fill="none" stroke="url(#cyberLaser)" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.75" />

  <!-- ══════════════════════════════════════════════════════════════════
       HEXAGONAL AEROSPACE SHIELD (PRECISION 60°/120° GEOMETRY)
       ══════════════════════════════════════════════════════════════════ -->
  <!-- Outer Shield Face -->
  <polygon
    points="256,64 422,160 422,352 256,448 90,352 90,160"
    fill="#0a0d16"
    stroke="#334155"
    stroke-width="5"
  />

  <!-- Inner Precision Cyber Border -->
  <polygon
    points="256,84 402,168 402,344 256,428 110,344 110,168"
    fill="#0f1320"
    stroke="url(#cyberLaser)"
    stroke-width="2.5"
    filter="url(#softGlow)"
  />

  <!-- Subtle Engineering Grid Lines -->
  <g opacity="0.25" stroke="#64748b" stroke-width="1">
    <line x1="130" y1="210" x2="382" y2="210" />
    <line x1="120" y1="256" x2="392" y2="256" />
    <line x1="130" y1="302" x2="382" y2="302" />
    <line x1="256" y1="94" x2="256" y2="418" />
  </g>

  <!-- ══════════════════════════════════════════════════════════════════
       ARCHITECTURAL "R" MONOGRAM (SOLID, POWERFUL, HUMAN-DESIGNED)
       ══════════════════════════════════════════════════════════════════ -->
  <g id="r-monogram">
    <!-- Left Vertical Spine (Titanium Solid Pillar) -->
    <path
      d="M 168 152 L 216 152 L 216 360 L 168 360 Z"
      fill="url(#titanium)"
    />
    <!-- Spine Bevel Shadow -->
    <path
      d="M 168 152 L 180 164 L 180 348 L 168 360 Z"
      fill="#475569"
      opacity="0.8"
    />
    <!-- Spine Hairline Cyan Conduit -->
    <line x1="192" y1="164" x2="192" y2="348" stroke="#00f5ff" stroke-width="2" filter="url(#softGlow)" />

    <!-- Upper R Loop (Geometric Hexagon Top) -->
    <path
      d="M 216 152 L 308 152 C 344 152 364 172 364 206 C 364 240 344 260 308 260 L 216 260 Z"
      fill="url(#titanium)"
    />
    <!-- Inner Loop Cutout (Negative Space) -->
    <path
      d="M 216 188 L 300 188 C 318 188 326 196 326 206 C 326 216 318 224 300 224 L 216 224 Z"
      fill="#0f1320"
    />

    <!-- Dynamic 45° Angular Kick-Leg -->
    <polygon
      points="254,252 312,252 374,360 316,360"
      fill="url(#titanium)"
    />
    <!-- Kick-Leg Bevel Cut -->
    <polygon
      points="254,252 268,264 304,348 316,360 298,360"
      fill="#334155"
      opacity="0.85"
    />

    <!-- Electric Cyan Thrust Line on Kick-Leg -->
    <line x1="280" y1="262" x2="342" y2="360" stroke="#00f5ff" stroke-width="3" stroke-linecap="round" filter="url(#softGlow)" />

    <!-- Intersection Anchor Core -->
    <circle cx="216" cy="260" r="6" fill="#00f5ff" filter="url(#softGlow)" />
  </g>

  <!-- Technical Corner Registration Marks -->
  <g fill="#00f5ff" opacity="0.9">
    <circle cx="256" cy="84" r="3.5" />
    <circle cx="402" cy="168" r="3" />
    <circle cx="402" cy="344" r="3" />
    <circle cx="256" cy="428" r="3.5" />
    <circle cx="110" cy="344" r="3" />
    <circle cx="110" cy="168" r="3" />
  </g>
</svg>
