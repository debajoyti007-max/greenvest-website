<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/rymon_logo.jpg" />
    <link rel="apple-touch-icon" href="/rymon_logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="RYMON GHOST CONNECT — Hardware Telemetry & License Management Dashboard | greenvest.shop"
    />
    <meta name="theme-color" content="#07090e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- DNS prefetch for fallback/non-critical external services -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- ⚡ Preconnect: Fonts + Supabase — opens TCP+TLS handshake BEFORE React starts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://zvjqpigduyvczidzafus.supabase.co" crossorigin />

    <!-- Google Fonts: Inter & DM Sans -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap"
      as="style"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap"
      />
    </noscript>

    <title>Greenvest StreamGuard — VIP Telemetry Remote & Broadcast Console</title>
    <link rel="canonical" href="https://greenvest.shop/" />
    <meta
      name="keywords"
      content="Greenvest StreamGuard, greenvest.shop, VIP Streamer Remote, Telemetry HUD, StreamGuard, Free Fire MAX"
    />

    <!-- ── Open Graph ── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://greenvest.shop/" />
    <meta property="og:site_name" content="Greenvest StreamGuard" />
    <meta property="og:title" content="Greenvest StreamGuard — VIP Telemetry Remote & Broadcast Console" />
    <meta property="og:description" content="Next-generation tactical hardware telemetry remote, radar HUD, and broadcast integrity suite." />
    <meta property="og:image" content="https://greenvest.shop/rymon_logo.jpg" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="800" />
    <meta property="og:locale" content="en_US" />

    <!-- ── Twitter / X Card ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RYMON GHOST CONNECT — Telemetry Remote & License Dashboard" />
    <meta name="twitter:description" content="Next-generation hardware telemetry remote and KeyAuth license manager for Rymon Corporation." />
    <meta name="twitter:image" content="https://greenvest.shop/rymon_logo.jpg" />

    <!-- ── JSON-LD Structured Data ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "RYMON GHOST CONNECT",
      "alternateName": ["greenvest.shop", "GhostConnect"],
      "url": "https://greenvest.shop/",
      "description": "Hardware Telemetry Remote & License Dashboard for Rymon Corporation",
      "applicationCategory": "UtilityApplication",
      "operatingSystem": "Android, Web"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
