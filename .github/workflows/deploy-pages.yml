name: Deploy GitHub Pages

on:
  push:
    branches: [master, main, feature/bengali-i18n-supabase]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://zvjqpigduyvczidzafus.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2anFwaWdkdXl2Y3ppZHphZnVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxOTYzNjAsImV4cCI6MjEwMTc3MjM2MH0.jQjWuhoPsHAYuTAVPl-CWlXLfCmlI0aEny18XsEBpEo' }}
        run: npm run build
      # SPA deep links on GitHub Pages
      - run: cp dist/index.html dist/404.html
      # Custom domain + bypass Jekyll
      - run: echo "greenvest.shop" > dist/CNAME
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
